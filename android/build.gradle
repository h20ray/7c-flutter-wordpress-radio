allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// add These lines from here. in android/build.gradle  (NOT android/app/build.gradle)
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
            }
            // Suppress compiler warnings for all subprojects
            project.tasks.withType(JavaCompile) {
                options.compilerArgs << '-Xlint:-deprecation'
                options.compilerArgs << '-Xlint:-unchecked'
                options.compilerArgs << '-Xlint:-processing'
                options.compilerArgs << '-Xlint:-options'
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.facebook.infer.annotation' && details.requested.name == 'infer-annotation') {
                details.useVersion '0.18.0'
            }
        }
    }
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
