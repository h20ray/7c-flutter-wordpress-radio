# Gradle JVM settings - reduced memory allocation
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+UseStringDeduplication

# Daemon settings with timeout
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# Build optimizations
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.logging.level=QUIET

# Android settings
android.useAndroidX=true
android.enableJetifier=true

